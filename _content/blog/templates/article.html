<html lang="en-GB">
	<head>
		<title>{{title}} · Tan Wei Jin</title>
		<meta charset="utf-8" />

		<meta name="viewport" content="width=device-width, initial-scale=1" />

	<body class="journal">
	<a class="skip-link" href="#main">Skip to content</a>
	<header class="site-header"><a class="site-brand" href="{{root}}index.html" aria-label="Wei Jin home"><img src="{{root}}images/Jin2.png" alt="Jin" width="135" height="135" /></a><nav aria-label="Main navigation"><a href="{{root}}index.html">Who Am I?</a><a href="{{root}}work.html">Professional</a><a href="{{root}}blog/index.html" aria-current="location">Personal Blog</a><a href="{{root}}CV_TanWeiJin.pdf" target="_blank" rel="noopener noreferrer">Resume</a></nav></header>

		<!-- Wrapper -->
			<div id="wrapper">

				<!-- Header -->
				<header id="header">
					<a href="{{category_url}}#header" class="logo">Back</a>
				</header>

				<!-- Nav -->
				{{navigation}}

				<!-- Main -->
					<div id="main" role="main" tabindex="-1">

						<!-- Post -->
							<section class="post"><header class="major"><span class="date">{{date}}</span><h1>{{title}}</h1>{{subtitle}}</header>
{{body}}
</section>
					</div>

				<!-- Copyright -->


			</div>
<footer class="site-footer" id="contact" aria-label="Contact and site information" data-site-footer></footer>

		<!-- Scripts -->
			<script src="{{root}}assets/js/site-footer.js"></script>
	<script src="{{root}}assets/js/site.js"></script>
